<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alchemy Sandbox</title>
<style>
  :root { --bg:#0e0f14; --panel:#181a22; --ink:#e8e8ee; --dim:#8a8d9c; --accent:#ffb44d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:12px 16px; gap:10px; }
  h1 { margin:0; font-size:18px; letter-spacing:.08em; text-transform:uppercase; }
  h1 span { color:var(--accent); }
  canvas { width:min(100%, 960px); aspect-ratio: 4/3; image-rendering:pixelated; background:#000;
           border-radius:8px; touch-action:none; cursor:crosshair; }
  .bar { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:960px; }
  button { background:var(--panel); color:var(--ink); border:2px solid transparent; border-radius:8px;
           padding:8px 12px; font:inherit; cursor:pointer; }
  button.on { border-color:var(--accent); }
  button .sw { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .hint { color:var(--dim); font-size:13px; text-align:center; max-width:640px; }
  label { color:var(--dim); display:flex; align-items:center; gap:6px; }
</style>
</head>
<body>
<h1>Alchemy <span>Sandbox</span></h1>
<canvas id="c" width="240" height="180"></canvas>
<div class="bar" id="palette"></div>
<div class="bar">
  <label>Brush <input id="size" type="range" min="1" max="8" value="3"></label>
  <button id="pause">Pause</button>
  <button id="clear">Clear</button>
  <button id="demo">Surprise me</button>
</div>
<div class="hint">Drop seeds into water to grow a garden. Light it. Pour oil on the water first. Lava melts sand into wall and boils the sea. Ice melts near fire and lava, and slowly freezes water beside it. Salt melts ice. Powder goes off in a chain. Keys 1–9 and 0 pick a material.</div>
<script src="engine.js"></script>
<script>
const A = Alchemy, W = 240, H = 180;
const world = new A.World(W, H, (Math.random() * 1e9) | 0);
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const img = ctx.createImageData(W, H);
const COLORS = {
  [A.EMPTY]: [14, 15, 20], [A.WALL]: [90, 92, 105], [A.SAND]: [226, 190, 110],
  [A.WATER]: [52, 116, 224], [A.FIRE]: [255, 140, 30], [A.SEED]: [180, 230, 90],
  [A.PLANT]: [40, 170, 70], [A.ASH]: [120, 118, 122], [A.OIL]: [96, 60, 40],
  [A.STEAM]: [190, 200, 220], [A.LAVA]: [240, 70, 20], [A.STONE]: [70, 62, 66],
  [A.ICE]: [170, 220, 240], [A.SALT]: [238, 236, 230], [A.POWDER]: [70, 72, 80],
};
const TOOLS = [A.SAND, A.WATER, A.FIRE, A.SEED, A.OIL, A.LAVA, A.WALL, A.PLANT, A.EMPTY, A.ICE, A.SALT, A.POWDER];
let tool = A.SAND, paused = false, down = false, last = null;

const pal = document.getElementById('palette');
TOOLS.forEach((t, i) => {
  const b = document.createElement('button');
  const c = COLORS[t];
  b.innerHTML = `<span class="sw" style="background:rgb(${c})"></span>${A.NAMES[t]}${i < 10 ? ` <small>${(i + 1) % 10}</small>` : ''}`;
  b.onclick = () => select(t);
  b.dataset.t = t;
  pal.appendChild(b);
});
function select(t) {
  tool = t;
  [...pal.children].forEach(b => b.classList.toggle('on', +b.dataset.t === t));
}
select(A.SAND);
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = TOOLS[(e.key === '0' ? 10 : +e.key) - 1]; if (t !== undefined) select(t);
  if (e.target.tagName === 'BUTTON') return; // a focused button already answers Space itself
  if (e.key === ' ') { e.preventDefault(); document.getElementById('pause').click(); }
  if (e.key === 'c' || e.key === 'C') document.getElementById('clear').click();
});

function pos(e) {
  const r = canvas.getBoundingClientRect();
  return [Math.floor((e.clientX - r.left) / r.width * W), Math.floor((e.clientY - r.top) / r.height * H)];
}
function dab(x, y) {
  const r = +document.getElementById('size').value;
  for (let dy = -r; dy <= r; dy++)
    for (let dx = -r; dx <= r; dx++)
      if (dx * dx + dy * dy <= r * r && (tool !== A.WALL && tool !== A.PLANT || true)) {
        if (tool === A.WALL || tool === A.EMPTY || tool === A.PLANT || tool === A.ICE || Math.random() < 0.5) world.paint(x + dx, y + dy, tool);
      }
}
function stroke(a, b) {
  const n = Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1]), 1);
  for (let i = 0; i <= n; i++) dab(Math.round(a[0] + (b[0] - a[0]) * i / n), Math.round(a[1] + (b[1] - a[1]) * i / n));
}
canvas.addEventListener('pointerdown', e => { down = true; canvas.setPointerCapture(e.pointerId); last = pos(e); stroke(last, last); });
canvas.addEventListener('pointermove', e => { if (down) { const p = pos(e); stroke(last, p); last = p; } });
addEventListener('pointerup', () => down = false);

document.getElementById('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Play' : 'Pause'; };
document.getElementById('clear').onclick = () => { world.cells.fill(0); world.life.fill(0); };
document.getElementById('demo').onclick = () => {
  world.cells.fill(0); world.life.fill(0);
  const fill = (x0, y0, x1, y1, t) => { for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) world.set(x, y, t); };
  fill(0, 170, W, H, A.WALL);
  fill(20, 120, 22, 170, A.WALL); fill(140, 120, 142, 170, A.WALL);
  fill(22, 140, 140, 170, A.WATER);
  fill(22, 128, 140, 140, A.OIL);
  for (let i = 0; i < 12; i++) world.set(30 + i * 9, 100 + (i % 3), A.SEED);
  fill(160, 60, 200, 90, A.SAND);
  fill(170, 20, 190, 30, A.LAVA);
  world.set(80, 100, A.FIRE);
};

function draw() {
  const d = img.data, c = world.cells;
  for (let i = 0; i < c.length; i++) {
    let col = COLORS[c[i]], j = i * 4;
    let s = 1;
    if (c[i] === A.FIRE) s = 0.7 + Math.random() * 0.5;
    else if (c[i] === A.WATER || c[i] === A.LAVA) s = 0.9 + Math.random() * 0.1;
    d[j] = Math.min(255, col[0] * s); d[j + 1] = Math.min(255, col[1] * s); d[j + 2] = Math.min(255, col[2] * s); d[j + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}
function frame() {
  if (!paused) { world.step(); world.step(); }
  draw();
  requestAnimationFrame(frame);
}
document.getElementById('demo').click();
frame();
window.__world = world;
</script>
</body>
</html>
